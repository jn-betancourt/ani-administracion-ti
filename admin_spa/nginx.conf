server {
  listen 81;
  server_name localhost;
  client_max_body_size 50M;

  # Desactivar inclusión de puerto interno en redirecciones de Nginx
  port_in_redirect off;
  proxy_redirect off;

  # DNS Resolver interno de Docker para resolución dinámica
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Reverse Proxy hacia el contenedor Backend Express en la red de Dokploy
  location /api/ {
    proxy_pass http://ani-web-api:3030/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://ani-web-api:3030/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
