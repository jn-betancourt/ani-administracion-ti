version: '3.8'

services:
  ani-web-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ani-web-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - STORAGE_PATH=/mnt/ani
      - SAMBA_MOUNT_PATH=/mnt/samba
      - JWT_SECRET=ani_seguridad_infraestructura_secret_2026_jwt
      - WEB_SERVER_IP=10.88.199.214
      - LINUX_SERVER_IP=10.88.199.195
      - NTP_SERVER=10.88.199.195
      - NFS_SERVER=10.88.199.195:/ani
      - SAMBA_SERVER=//10.88.199.195/compartido
      - NIS_DOMAIN=labnis
      - NIS_SERVER=10.88.199.195
      - CUPS_SERVER=ipp://10.88.199.195:631/printers/ani_sede_principal
    volumes:
      # Montaje directo de los sistemas de archivos compartidos desde el host web (10.88.199.214)
      - /mnt/ani:/mnt/ani:rw
      - /mnt/samba:/mnt/samba:rw
      # Almacenamiento local de respaldo
      - ./storage:/app/storage:rw
    networks:
      - ani-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ani-api.rule=Host(`api.ani.ingeniero.app`) || Host(`ani.local`) || Host(`10.88.199.214`)"
      - "traefik.http.routers.ani-api.entrypoints=web"
      - "traefik.http.services.ani-api.loadbalancer.server.port=3030"

  ani-admin-spa:
    build:
      context: ./admin_spa
      dockerfile: Dockerfile
    container_name: ani-admin-spa
    restart: unless-stopped
    ports:
      - "3001:81"
    networks:
      - ani-net
    depends_on:
      - ani-web-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ani-admin.rule=Host(`admin.ani.ingeniero.app`) || Host(`admin.ani.local`)"
      - "traefik.http.routers.ani-admin.entrypoints=web"
      - "traefik.http.services.ani-admin.loadbalancer.server.port=81"

networks:
  ani-net:
    driver: bridge
